name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets-and-capital
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (type-check + lint + compile)
        run: npm run build

      # Ratchet, not a gate. Fails only when a file gains untranslated copy or
      # a new file arrives carrying some — existing debt is recorded in
      # scripts/i18n-baseline.json and paid down at whatever pace suits.
      #
      # Runs after the build because a file that does not compile cannot be
      # meaningfully scanned, and before the e2e tests because it takes a
      # second where they take minutes.
      - name: Untranslated copy (i18n ratchet)
        run: npm run check:i18n

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          CI: "true"
